<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — FFM Store</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="topbar">
  <div class="brand">FFM <span>STORE</span></div>
  <div class="tag">Admin Panel</div>
</header>

<main class="admin-main">
  <!-- Login view -->
  <section id="loginView" class="admin-login hidden">
    <div class="modal-card login-card">
      <p class="eyebrow">ADMIN ACCESS</p>
      <h2>Sign in</h2>
      <p class="sub-sm">Only authorized admins can view and manage orders.</p>
      <form id="loginForm">
        <label>Email<input id="email" type="email" autocomplete="username" placeholder="admin@ffmstore.app" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required></label>
        <button class="btn full" type="submit" id="loginBtn">Sign in</button>
        <p id="loginError" class="status err"></p>
      </form>
    </div>
  </section>

  <!-- Dashboard view -->
  <section id="dashView" class="hidden">
    <div class="section-head">
      <div>
        <p class="eyebrow">ORDERS</p>
        <h2>Order Dashboard</h2>
      </div>
      <button class="copy" id="logoutBtn">Sign out</button>
    </div>

    <div class="admin-toolbar">
      <div class="filters" id="statusFilters">
        <button class="cat-btn active" data-status="all">All</button>
        <button class="cat-btn" data-status="pending">Pending</button>
        <button class="cat-btn" data-status="verified">Verified</button>
        <button class="cat-btn" data-status="completed">Completed</button>
        <button class="cat-btn" data-status="rejected">Rejected</button>
      </div>
      <button class="copy" id="refreshBtn">Refresh</button>
    </div>

    <p id="dashMsg" class="hint"></p>

    <!-- Desktop table -->
    <div class="table-wrap">
      <table class="orders-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Service</th>
            <th>UID / Player</th>
            <th>Amount</th>
            <th>UTR</th>
            <th>Status</th>
            <th>Update</th>
          </tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>

    <!-- Mobile cards -->
    <div id="ordersCards" class="orders-cards"></div>
  </section>
</main>

<script type="module" src="admin.js"></script>
</body>
</html>
